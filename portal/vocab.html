<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSAT Vocabulary Practice — Moretti Test Prep &amp; Tutoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --red:#B0271C; --gold:#C9A84C; --bg:#f7f4ef; --white:#fff; --text:#111; --mid:rgba(17,17,17,0.58); --faint:rgba(17,17,17,0.30); --border:rgba(17,17,17,0.13); --green:#3f7d54; --greenbg:#eaf3ec; --redbg:#f8ecea; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; font-weight:400; -webkit-font-smoothing:antialiased; padding:1.75rem 1.1rem 4rem; }
  .wrap { max-width:640px; margin:0 auto; }
  header { text-align:center; margin-bottom:1.5rem; }
  h1 { font-family:'Caladea',Georgia,serif; font-size:1.55rem; line-height:1.15; }
  .subtitle { font-size:.8rem; color:var(--mid); margin-top:.35rem; }

  .panel-label { font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin:1.25rem 0 .55rem; }
  .pills { display:flex; flex-wrap:wrap; gap:.45rem; }
  .pill { font-family:inherit; font-size:.8rem; font-weight:500; color:var(--text); background:var(--white); border:1px solid var(--border); border-radius:999px; padding:.45rem .95rem; cursor:pointer; transition:border-color .12s, background .12s, color .12s; }
  .pill:hover { border-color:var(--mid); }
  .pill.on { border-color:var(--red); background:var(--red); color:#fff; font-weight:600; }

  .modes { display:flex; gap:.4rem; margin-top:1.25rem; border:1px solid var(--border); border-radius:8px; padding:.3rem; background:var(--white); }
  .mode-btn { flex:1; font-family:inherit; font-size:.8rem; font-weight:600; letter-spacing:.03em; color:var(--mid); background:transparent; border:none; border-radius:6px; padding:.6rem .4rem; cursor:pointer; }
  .mode-btn.on { background:var(--red); color:#fff; }

  .stage { margin-top:1.5rem; }
  .bar-row { display:flex; align-items:center; justify-content:space-between; font-size:.72rem; color:var(--mid); margin-bottom:.6rem; }
  .bar-track { height:5px; background:#e7e0d5; border-radius:3px; overflow:hidden; margin-bottom:1rem; }
  .bar-fill { height:100%; background:var(--gold); width:0; transition:width .25s ease; }

  /* Flashcards */
  .card { position:relative; background:var(--white); border:1px solid var(--border); border-radius:14px; min-height:220px; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem 1.5rem; cursor:pointer; user-select:none; }
  .card .side-tag { position:absolute; top:.85rem; left:1rem; font-size:.58rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); }
  .card .term { font-family:'Caladea',serif; font-size:1.7rem; line-height:1.2; }
  .card .def { font-size:1.05rem; line-height:1.6; color:var(--text); }
  .flip-hint { text-align:center; font-size:.72rem; color:var(--faint); margin-top:.7rem; }
  .fc-controls { display:flex; gap:.6rem; margin-top:1rem; }
  .fc-controls button { flex:1; font-family:inherit; font-size:.78rem; font-weight:600; letter-spacing:.04em; padding:.75rem; border-radius:8px; cursor:pointer; border:1px solid var(--border); background:var(--white); color:var(--text); }
  .fc-controls .still { border-color:var(--red); color:var(--red); }
  .fc-controls .still:hover { background:var(--redbg); }
  .fc-controls .got { border-color:var(--green); color:var(--green); }
  .fc-controls .got:hover { background:var(--greenbg); }
  .nav-row { display:flex; align-items:center; justify-content:space-between; margin-top:1rem; }
  .nav-row button { font-family:inherit; font-size:.75rem; font-weight:600; color:var(--mid); background:none; border:none; cursor:pointer; padding:.4rem .6rem; }
  .nav-row button:disabled { color:var(--faint); cursor:default; }

  /* Quiz (MC + type) */
  .prompt { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:1.4rem 1.35rem; margin-bottom:1rem; }
  .prompt .plabel { font-size:.58rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin-bottom:.5rem; }
  .prompt .ptext { font-size:1.15rem; line-height:1.5; }
  .prompt .ptext.big { font-family:'Caladea',serif; font-size:1.6rem; }
  .options { display:flex; flex-direction:column; gap:.55rem; }
  .opt { font-family:inherit; font-size:.95rem; text-align:left; background:var(--white); border:1px solid var(--border); border-radius:9px; padding:.85rem 1rem; cursor:pointer; transition:border-color .1s; }
  .opt:hover:not(:disabled) { border-color:var(--mid); }
  .opt.correct { border-color:var(--green); background:var(--greenbg); color:var(--green); font-weight:600; }
  .opt.wrong { border-color:var(--red); background:var(--redbg); color:var(--red); }
  .opt:disabled { cursor:default; }

  .type-in { width:100%; font-family:inherit; font-size:1.05rem; padding:.85rem 1rem; border:1px solid var(--border); border-radius:9px; background:var(--white); }
  .type-in:focus { outline:none; border-color:var(--red); }
  .type-feedback { min-height:1.4rem; margin-top:.7rem; font-size:.9rem; font-weight:500; }
  .type-feedback.ok { color:var(--green); }
  .type-feedback.no { color:var(--red); }

  .primary-btn { display:block; width:100%; font-family:inherit; font-size:.9rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; background:var(--red); color:#fff; border:none; border-radius:8px; padding:.9rem; margin-top:1rem; cursor:pointer; }
  .primary-btn:hover { opacity:.93; }

  .summary { text-align:center; background:var(--white); border:1px solid var(--border); border-radius:14px; padding:2rem 1.5rem; }
  .summary .big-score { font-family:'Caladea',serif; font-size:2.6rem; color:var(--gold); line-height:1; }
  .summary .score-sub { font-size:.85rem; color:var(--mid); margin:.5rem 0 1.25rem; }

  .empty { text-align:center; color:var(--mid); font-size:.9rem; padding:2rem 1rem; }
  .foot { text-align:center; color:var(--faint); font-size:.68rem; margin-top:2.5rem; }
  .foot .sample-note { color:var(--red); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DSAT Vocabulary Practice</h1>
    <div class="subtitle">Moretti Test Prep &amp; Tutoring</div>
  </header>

  <div class="panel-label">Choose your sets</div>
  <div class="pills" id="set-pills"></div>

  <div class="modes" id="mode-tabs">
    <button class="mode-btn on" data-mode="flash">Flashcards</button>
    <button class="mode-btn" data-mode="mc">Multiple choice</button>
    <button class="mode-btn" data-mode="type">Type it</button>
  </div>

  <div class="stage" id="stage"></div>

  <div class="foot">
    Moretti Test Prep &amp; Tutoring · Cranford, NJ · (201) 275-2791<br>
    <span class="sample-note" id="sample-note">Showing sample words — official vocabulary list not yet loaded.</span>
  </div>
</div>

<script>
  /* ═══════════════════════════════════════════════════════════════════
     VOCABULARY DATA — replace the sample entries below with the official
     lists (exported from Quizlet). Format: each set is an array of
     { term, def } objects. Set names become the pills at the top.
     Delete the SAMPLE flag line at the bottom once real data is in.
     ═══════════════════════════════════════════════════════════════════ */
  var VOCAB = {
    "Set 1": [
      { term: "ambivalent", def: "having mixed or contradictory feelings about something" },
      { term: "candid", def: "truthful and straightforward; frank" },
      { term: "capricious", def: "given to sudden and unaccountable changes of mood or behavior" },
      { term: "deferential", def: "showing respectful submission or yielding to another" },
      { term: "ephemeral", def: "lasting for a very short time" }
    ],
    "Set 2": [
      { term: "gregarious", def: "fond of company; sociable" },
      { term: "impetuous", def: "acting or done quickly and without thought or care" },
      { term: "laconic", def: "using very few words; terse" },
      { term: "meticulous", def: "showing great attention to detail; very careful" },
      { term: "nonchalant", def: "feeling or appearing casually calm and relaxed; indifferent" }
    ],
    "Set 3": [
      { term: "obstinate", def: "stubbornly refusing to change one's opinion or course" },
      { term: "pragmatic", def: "dealing with things sensibly and realistically" },
      { term: "quell", def: "to put an end to, typically by force; to calm or subdue" },
      { term: "resilient", def: "able to recover quickly from difficulties; tough" },
      { term: "scrutinize", def: "to examine or inspect closely and thoroughly" }
    ],
    "Set 4": [
      { term: "tenacious", def: "holding firmly to something; persistent and determined" },
      { term: "ubiquitous", def: "present, appearing, or found everywhere" },
      { term: "venerate", def: "to regard with great respect; to revere" },
      { term: "wary", def: "feeling or showing caution about possible dangers" },
      { term: "zealous", def: "having or showing great energy or enthusiasm" }
    ],
    "Set 5": [
      { term: "arduous", def: "involving or requiring strenuous effort; difficult and tiring" },
      { term: "benevolent", def: "well meaning and kindly" },
      { term: "cursory", def: "hasty and therefore not thorough or detailed" },
      { term: "diligent", def: "showing care and conscientious effort in one's work" },
      { term: "eloquent", def: "fluent or persuasive in speaking or writing" }
    ],
    "Set 6": [
      { term: "frugal", def: "sparing or economical with money or resources" },
      { term: "hackneyed", def: "lacking originality; overused and unoriginal" },
      { term: "indifferent", def: "having no particular interest or sympathy; unconcerned" },
      { term: "juxtapose", def: "to place side by side for contrasting effect" },
      { term: "keen", def: "having or showing eagerness or enthusiasm; sharp" }
    ]
  };
  var IS_SAMPLE = true; // set to false when the official list is loaded
  /* ═══════════════════════════════════════════════════════════════════ */

  var setNames = Object.keys(VOCAB);
  var selectedSets = setNames.slice(); // all on by default
  var mode = 'flash';

  if (!IS_SAMPLE) { var sn = document.getElementById('sample-note'); if (sn) sn.style.display = 'none'; }

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pool() {
    var out = [];
    selectedSets.forEach(function (s) { (VOCAB[s] || []).forEach(function (c) { out.push(c); }); });
    return out;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) { return String(s).toLowerCase().trim().replace(/[^a-z0-9]/g, ''); }

  /* ── Set pills ── */
  var pillsEl = document.getElementById('set-pills');
  function renderPills() {
    pillsEl.innerHTML = '';
    var all = document.createElement('button');
    all.className = 'pill' + (selectedSets.length === setNames.length ? ' on' : '');
    all.textContent = 'All sets';
    all.addEventListener('click', function () { selectedSets = setNames.slice(); renderPills(); render(); });
    pillsEl.appendChild(all);
    setNames.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'pill' + (selectedSets.indexOf(s) !== -1 ? ' on' : '');
      b.textContent = s;
      b.addEventListener('click', function () {
        var i = selectedSets.indexOf(s);
        if (i === -1) selectedSets.push(s);
        else if (selectedSets.length > 1) selectedSets.splice(i, 1); // keep at least one
        renderPills(); render();
      });
      pillsEl.appendChild(b);
    });
  }

  /* ── Mode tabs ── */
  Array.prototype.forEach.call(document.querySelectorAll('.mode-btn'), function (btn) {
    btn.addEventListener('click', function () {
      mode = btn.getAttribute('data-mode');
      Array.prototype.forEach.call(document.querySelectorAll('.mode-btn'), function (b) { b.classList.toggle('on', b === btn); });
      render();
    });
  });

  var stage = document.getElementById('stage');

  function render() {
    var cards = pool();
    if (!cards.length) { stage.innerHTML = '<div class="empty">Pick at least one set to start.</div>'; return; }
    if (mode === 'flash') renderFlash(cards);
    else if (mode === 'mc') renderQuiz(cards, 'mc');
    else renderQuiz(cards, 'type');
  }

  /* ═══ FLASHCARDS ═══ */
  var fc = { order: [], idx: 0, flipped: false, still: [] };
  function renderFlash(cards) {
    fc.order = shuffle(cards); fc.idx = 0; fc.flipped = false; fc.still = [];
    drawFlash();
  }
  function drawFlash() {
    var c = fc.order[fc.idx];
    if (!c) { drawFlashSummary(); return; }
    var pct = Math.round((fc.idx) / fc.order.length * 100);
    stage.innerHTML =
      '<div class="bar-row"><span>Card ' + (fc.idx + 1) + ' of ' + fc.order.length + '</span><span>' + fc.still.length + ' to review</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="card" id="fc-card">' +
        '<span class="side-tag">' + (fc.flipped ? 'Definition' : 'Word') + '</span>' +
        (fc.flipped ? '<span class="def">' + esc(c.def) + '</span>' : '<span class="term">' + esc(c.term) + '</span>') +
      '</div>' +
      '<div class="flip-hint">Tap the card to flip</div>' +
      '<div class="fc-controls">' +
        '<button class="still" id="fc-still">Still learning</button>' +
        '<button class="got" id="fc-got">Got it</button>' +
      '</div>' +
      '<div class="nav-row">' +
        '<button id="fc-prev"' + (fc.idx === 0 ? ' disabled' : '') + '>&larr; Back</button>' +
        '<button id="fc-shuffle">Shuffle</button>' +
        '<button id="fc-next">Skip &rarr;</button>' +
      '</div>';
    document.getElementById('fc-card').addEventListener('click', function () { fc.flipped = !fc.flipped; drawFlash(); });
    document.getElementById('fc-still').addEventListener('click', function () { fc.still.push(fc.order[fc.idx]); advanceFlash(); });
    document.getElementById('fc-got').addEventListener('click', advanceFlash);
    document.getElementById('fc-prev').addEventListener('click', function () { if (fc.idx > 0) { fc.idx--; fc.flipped = false; drawFlash(); } });
    document.getElementById('fc-next').addEventListener('click', advanceFlash);
    document.getElementById('fc-shuffle').addEventListener('click', function () { renderFlash(pool()); });
  }
  function advanceFlash() { fc.idx++; fc.flipped = false; drawFlash(); }
  function drawFlashSummary() {
    var reviewed = fc.still.length;
    stage.innerHTML =
      '<div class="summary">' +
        '<div class="big-score">' + (fc.order.length - reviewed) + '/' + fc.order.length + '</div>' +
        '<div class="score-sub">marked "got it"' + (reviewed ? ' · ' + reviewed + ' still to review' : '') + '</div>' +
        (reviewed ? '<button class="primary-btn" id="fc-review">Review the ' + reviewed + ' you\'re still learning</button>' : '') +
        '<button class="primary-btn" id="fc-restart" style="background:' + (reviewed ? 'transparent;color:var(--red);border:1px solid var(--red)' : 'var(--red)') + '">Start over</button>' +
      '</div>';
    if (reviewed) document.getElementById('fc-review').addEventListener('click', function () { var s = fc.still.slice(); fc.order = shuffle(s); fc.idx = 0; fc.flipped = false; fc.still = []; drawFlash(); });
    document.getElementById('fc-restart').addEventListener('click', function () { renderFlash(pool()); });
  }

  /* ═══ QUIZ (multiple choice + type-it) ═══ */
  var qz = { order: [], idx: 0, score: 0, answered: false, kind: 'mc' };
  function renderQuiz(cards, kind) {
    qz.kind = kind; qz.order = shuffle(cards); qz.idx = 0; qz.score = 0; qz.answered = false;
    drawQuiz();
  }
  function drawQuiz() {
    var cards = qz.order;
    if (qz.idx >= cards.length) { drawQuizSummary(); return; }
    var c = cards[qz.idx];
    var pct = Math.round(qz.idx / cards.length * 100);
    var head =
      '<div class="bar-row"><span>Question ' + (qz.idx + 1) + ' of ' + cards.length + '</span><span>Score ' + qz.score + '</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';

    if (qz.kind === 'mc') {
      // definition shown, pick the word
      var others = shuffle(pool().filter(function (x) { return x.term !== c.term; }));
      var opts = shuffle([c].concat(others.slice(0, 3)));
      var optHtml = opts.map(function (o) { return '<button class="opt" data-term="' + esc(o.term) + '">' + esc(o.term) + '</button>'; }).join('');
      stage.innerHTML = head +
        '<div class="prompt"><div class="plabel">Which word means…</div><div class="ptext">' + esc(c.def) + '</div></div>' +
        '<div class="options" id="opts">' + optHtml + '</div>';
      Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function (b) {
        b.addEventListener('click', function () {
          if (qz.answered) return;
          qz.answered = true;
          var chosen = b.getAttribute('data-term');
          var correct = chosen === c.term;
          if (correct) qz.score++;
          Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function (o) {
            o.disabled = true;
            var t = o.getAttribute('data-term');
            if (t === c.term) o.classList.add('correct');
            else if (t === chosen) o.classList.add('wrong');
          });
          addNext();
        });
      });
    } else {
      // type-it: definition shown, type the word
      stage.innerHTML = head +
        '<div class="prompt"><div class="plabel">Type the word that means…</div><div class="ptext">' + esc(c.def) + '</div></div>' +
        '<input class="type-in" id="type-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="your answer">' +
        '<div class="type-feedback" id="type-fb"></div>' +
        '<button class="primary-btn" id="type-submit">Check</button>';
      var input = document.getElementById('type-in');
      input.focus();
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doCheck(); });
      document.getElementById('type-submit').addEventListener('click', doCheck);
      function doCheck() {
        if (qz.answered) return;
        qz.answered = true;
        var fb = document.getElementById('type-fb');
        var correct = norm(input.value) === norm(c.term);
        if (correct) { qz.score++; fb.className = 'type-feedback ok'; fb.textContent = 'Correct — ' + c.term; }
        else { fb.className = 'type-feedback no'; fb.textContent = 'Answer: ' + c.term; }
        input.disabled = true;
        document.getElementById('type-submit').style.display = 'none';
        addNext();
      }
    }
  }
  function addNext() {
    var b = document.createElement('button');
    b.className = 'primary-btn';
    b.textContent = qz.idx + 1 >= qz.order.length ? 'See results' : 'Next';
    b.addEventListener('click', function () { qz.idx++; qz.answered = false; drawQuiz(); });
    stage.appendChild(b);
  }
  function drawQuizSummary() {
    var n = qz.order.length, s = qz.score, pctv = Math.round(s / n * 100);
    stage.innerHTML =
      '<div class="summary">' +
        '<div class="big-score">' + s + '/' + n + '</div>' +
        '<div class="score-sub">' + pctv + '% correct</div>' +
        '<button class="primary-btn" id="qz-again">Try again</button>' +
      '</div>';
    document.getElementById('qz-again').addEventListener('click', function () { renderQuiz(pool(), qz.kind); });
  }

  renderPills();
  render();
</script>
</body>
</html>
