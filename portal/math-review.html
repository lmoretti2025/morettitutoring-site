<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Math Bank Review — Moretti Test Prep &amp; Tutoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="question-bank-math.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red:    #B0271C;
    --bg:     #f2f2f2;
    --white:  #ffffff;
    --text:   #111111;
    --mid:    rgba(17,17,17,0.58);
    --faint:  rgba(17,17,17,0.28);
    --border: rgba(17,17,17,0.12);
    --gold:   #C9A84C;
    --green:  #3f7d54;
    --hel:    'Poppins', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --serif:  'Iowan Old Style', Georgia, ui-serif, 'Times New Roman', serif;
    --display: 'Iowan Old Style', Georgia, ui-serif, serif;
    --dx-navy: #12284c;
    --dx-blue: #3457d5;
    --shadow: 0 2px 16px rgba(17,17,17,0.055);
    --ease:   cubic-bezier(0.16,1,0.3,1);
  }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--hel); -webkit-font-smoothing: antialiased; }

  /* ═══ GATE — identical pattern to admin.html's own gate, reusing the
     SAME getRoster admin-key check (no new backend action needed). ═══ */
  header { background: var(--red); color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  header .brand { font-family: var(--display); font-size: 1.1rem; }
  header .brand small { display: block; font-family: var(--hel); font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; margin-top: 0.15rem; }
  #gate { max-width: 380px; margin: 4.5rem auto 0; background: var(--white); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 2rem 1.75rem; text-align: center; }
  #gate .eyebrow { font-family: var(--hel); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--red); margin-bottom: 0.5rem; }
  #gate h1 { font-family: var(--display); font-size: 1.5rem; margin: 0 0 0.5rem; }
  #gate p { color: var(--mid); font-size: 0.85rem; line-height: 1.5; margin: 0 0 1.25rem; }
  #gate input { width: 100%; font-family: var(--hel); font-size: 0.95rem; padding: 0.7rem 0.9rem; border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 0.9rem; text-align: center; letter-spacing: 0.04em; }
  #gate input:focus { outline: none; border-color: var(--red); }
  #gate button { width: 100%; font-family: var(--hel); font-weight: 700; font-size: 0.9rem; background: var(--red); color: #fff; border: none; border-radius: 999px; padding: 0.75rem; cursor: pointer; }
  #gate button:disabled { opacity: 0.6; cursor: default; }
  #gate-error { color: var(--red); font-size: 0.8rem; font-weight: 600; margin-top: 0.7rem; min-height: 1.1em; }

  /* ═══ MAIN TOOL ═══ */
  #tool { display: none; max-width: 900px; margin: 0 auto; padding: 1.5rem 1.5rem 5rem; }
  .rv-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.9rem; background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
  .rv-progress { font-family: var(--hel); font-size: 0.82rem; font-weight: 600; color: var(--text); }
  .rv-progress b { color: var(--red); }
  .rv-bar { flex: 1 1 140px; height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; min-width: 100px; }
  .rv-bar-fill { height: 100%; background: var(--green); border-radius: 999px; }
  .rv-select { font-family: var(--hel); font-size: 0.78rem; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: 8px; background: var(--white); color: var(--text); }
  .rv-export-btn { font-family: var(--hel); font-weight: 700; font-size: 0.76rem; background: var(--dx-navy); color: #fff; border: none; border-radius: 8px; padding: 0.55rem 0.9rem; cursor: pointer; }
  .rv-export-btn:hover { opacity: 0.88; }

  .rv-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 1.6rem 1.8rem 1.9rem; }
  .rv-card-hed { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 1.1rem; padding-bottom: 0.9rem; border-bottom: 1px solid var(--border); }
  .rv-qnum-tile { flex-shrink: 0; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #000; color: #fff; font-family: var(--hel); font-weight: 700; font-size: 0.85rem; border-radius: 6px; }
  .rv-tag { font-family: var(--hel); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--mid); background: var(--bg); border-radius: 999px; padding: 0.28rem 0.65rem; }
  .rv-tag.diff-hard { color: #8a3b1a; background: #f8e8de; }
  .rv-tag.diff-medium { color: #7a6110; background: #f7f0d8; }
  .rv-tag.diff-easy { color: #276b3f; background: #e2f0e6; }
  .rv-status-pill { margin-left: auto; font-family: var(--hel); font-size: 0.72rem; font-weight: 700; padding: 0.3rem 0.7rem; border-radius: 999px; }
  .rv-status-pill.ok { background: #e2f0e6; color: var(--green); }
  .rv-status-pill.issue { background: #f8e0dd; color: var(--red); }
  .rv-status-pill.unreviewed { background: var(--bg); color: var(--faint); }

  .dx-qtext { font-family: var(--display); font-size: clamp(1.02rem, 1.7vw, 1.25rem); font-weight: 400; line-height: 1.55; color: var(--text); margin-bottom: 1.5rem; }
  .dx-table { border-collapse: collapse; margin: 0 0 1.3rem 0; font-family: var(--hel); font-size: 0.82rem; font-weight: 400; }
  .dx-table th, .dx-table td { border: 1px solid var(--border); padding: 0.5rem 1.1rem; text-align: center; }
  .dx-table th { background: var(--bg); font-weight: 700; }
  /* width:100% is load-bearing — see index.html's identical comment on
     this same rule. Every .dx-fig is a sizeless inline <svg>, which
     computes to 0×0 without it. */
  .dx-fig { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 0 1.3rem 0; }
  .dx-choices { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.4rem; }
  .dx-choice { display: flex; align-items: center; gap: 0.9rem; border: 1px solid var(--border); background: var(--white); padding: 0.75rem 1rem; border-radius: 8px; cursor: pointer; position: relative; }
  .dx-choice-letter { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--faint); display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 700; color: var(--mid); }
  .dx-choice-text { font-family: var(--serif); font-size: 0.88rem; color: var(--text); }
  .dx-choice.rv-system-answer { border-color: var(--green); background: #eef6f0; }
  .dx-choice.rv-system-answer .dx-choice-letter { background: var(--green); border-color: var(--green); color: #fff; }
  .dx-choice.rv-your-pick { box-shadow: inset 0 0 0 2px var(--dx-blue); }
  .rv-choice-badge { margin-left: auto; flex-shrink: 0; font-family: var(--hel); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; padding: 0.2rem 0.5rem; border-radius: 999px; }
  .rv-choice-badge.sys { background: var(--green); color: #fff; }
  .rv-choice-badge.pick { background: var(--dx-blue); color: #fff; }

  .rv-fr-row { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.4rem; font-family: var(--hel); font-size: 0.85rem; flex-wrap: wrap; }
  .rv-fr-row label { font-weight: 700; color: var(--mid); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .rv-fr-row input { font-family: var(--hel); font-size: 0.9rem; padding: 0.55rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; min-width: 140px; }
  .rv-fr-row input.rv-changed { border-color: var(--dx-blue); background: rgba(52,87,213,0.05); }

  .rv-explain-toggle { display: inline-block; font-family: var(--hel); font-size: 0.76rem; font-weight: 600; color: var(--dx-blue); cursor: pointer; margin-bottom: 1.2rem; background: none; border: none; padding: 0; }
  .rv-explain { display: none; font-family: var(--hel); font-size: 0.82rem; line-height: 1.65; color: var(--mid); background: var(--bg); border-radius: 8px; padding: 0.9rem 1.1rem; margin-bottom: 1.4rem; }
  .rv-explain.open { display: block; }

  .rv-controls { border-top: 1px solid var(--border); padding-top: 1.3rem; }
  .rv-controls-row { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
  .rv-controls-label { font-family: var(--hel); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); flex-shrink: 0; width: 100%; }
  .rv-btn { font-family: var(--hel); font-weight: 700; font-size: 0.82rem; border: 1.5px solid var(--border); background: var(--white); color: var(--text); border-radius: 999px; padding: 0.55rem 1.3rem; cursor: pointer; transition: all 0.15s var(--ease); }
  .rv-btn:hover { border-color: var(--mid); }
  .rv-btn.rv-ok.active { border-color: var(--green); background: #e2f0e6; color: var(--green); }
  .rv-btn.rv-issue.active { border-color: var(--red); background: #f8e0dd; color: var(--red); }
  .rv-note { width: 100%; font-family: var(--hel); font-size: 0.85rem; padding: 0.7rem 0.9rem; border: 1px solid var(--border); border-radius: 8px; resize: vertical; min-height: 3.4rem; }
  .rv-hint { font-family: var(--hel); font-size: 0.72rem; color: var(--faint); margin-top: 0.4rem; }

  .rv-nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; }
  .rv-nav-btn { font-family: var(--hel); font-weight: 700; font-size: 0.85rem; background: var(--dx-navy); color: #fff; border: none; border-radius: 999px; padding: 0.7rem 1.6rem; cursor: pointer; }
  .rv-nav-btn:hover { opacity: 0.9; }
  .rv-nav-btn:disabled { opacity: 0.35; cursor: default; }
  .rv-nav-btn.secondary { background: var(--white); color: var(--text); border: 1.5px solid var(--border); }
  .rv-kbd-hint { font-family: var(--hel); font-size: 0.7rem; color: var(--faint); text-align: center; }
  .rv-kbd-hint kbd { font-family: var(--hel); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; }

  .rv-empty { text-align: center; padding: 4rem 1rem; color: var(--mid); font-family: var(--hel); font-size: 0.9rem; }
  .rv-toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--dx-navy); color: #fff; font-family: var(--hel); font-size: 0.8rem; font-weight: 600; padding: 0.7rem 1.3rem; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 50; }
  .rv-toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="brand">MORETTI <small>Math Bank Review — internal QA tool</small></div>
</header>

<div id="gate">
  <div class="eyebrow">Admin only</div>
  <h1>Math Bank Review</h1>
  <p>Enter your admin key to review each Math question in the exact testing format and flag anything that transferred incorrectly.</p>
  <input type="text" id="gate-key" placeholder="Admin key" autocomplete="off">
  <button id="gate-submit">Continue</button>
  <div id="gate-error"></div>
</div>

<div id="tool">
  <div class="rv-toolbar">
    <div class="rv-progress"><b id="rv-reviewed-count">0</b> / <span id="rv-total-count">0</span> reviewed &middot; <b id="rv-flagged-count" style="color:var(--red)">0</b> flagged</div>
    <div class="rv-bar"><div class="rv-bar-fill" id="rv-bar-fill" style="width:0%"></div></div>
    <select class="rv-select" id="rv-filter-status">
      <option value="all">Show: All questions</option>
      <option value="unreviewed" selected>Show: Unreviewed only</option>
      <option value="issue">Show: Flagged issues only</option>
      <option value="ok">Show: Marked OK only</option>
    </select>
    <select class="rv-select" id="rv-filter-domain">
      <option value="">Domain: All</option>
    </select>
    <button class="rv-export-btn" id="rv-export-btn">Export report</button>
  </div>

  <div id="rv-card-wrap"></div>
  <div class="rv-kbd-hint" style="margin-top:0.9rem;"><kbd>Y</kbd> mark correct &amp; next &nbsp; <kbd>N</kbd> mark issue &nbsp; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> prev/next</div>
</div>

<div class="rv-toast" id="rv-toast"></div>

<!-- Same admin gate as admin.html — this page authenticates with the same
     credential, so without this it stops working when ADMIN_KEY is retired. -->
<script src="auth-admin-signin.js"></script>

<script>
(function () {
  'use strict';
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsLMGq3lhBEPObcas0k8gVS67NX9y4wXKG6RgzKtlBOT2SXfREK6vBpvvM19w9s1m6/exec';
  var SESSION_KEY = 'moretti_admin_key';
  var REVIEW_KEY = 'moretti_math_qa_review';
  var LETTERS = ['A', 'B', 'C', 'D'];

  var gateEl = document.getElementById('gate');
  var toolEl = document.getElementById('tool');
  var gateKeyEl = document.getElementById('gate-key');
  var gateSubmitEl = document.getElementById('gate-submit');
  var gateErrorEl = document.getElementById('gate-error');

  function postToBackend(payload) {
    return fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
  }

  function unlock(adminKey) {
    gateSubmitEl.disabled = true;
    gateErrorEl.textContent = '';
    return postToBackend({ action: 'getRoster', adminKey: adminKey }).then(function (data) {
      gateSubmitEl.disabled = false;
      if (!data || !data.ok) {
        gateErrorEl.textContent = (data && data.error === 'unauthorized') ? 'Wrong admin key.' : 'Could not verify — try again.';
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
        return;
      }
      try { sessionStorage.setItem(SESSION_KEY, adminKey); } catch (e) {}
      gateEl.style.display = 'none';
      toolEl.style.display = 'block';
      initTool();
    }).catch(function () {
      gateSubmitEl.disabled = false;
      gateErrorEl.textContent = 'Network error — check your connection and try again.';
    });
  }
  gateSubmitEl.addEventListener('click', function () {
    var key = gateKeyEl.value.trim();
    if (!key) { gateErrorEl.textContent = 'Enter the admin key.'; return; }
    unlock(key);
  });
  gateKeyEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') gateSubmitEl.click(); });
  (function tryAutoUnlock() {
    var saved = null;
    try { saved = sessionStorage.getItem(SESSION_KEY); } catch (e) {}
    if (saved) { gateKeyEl.value = saved; unlock(saved); }
  })();

  /* ═══ REVIEW TOOL ═══ Renders each Math Bank question in the same visual
     language as the real exam's #dx-card (same class names, borrowed CSS
     above) so what Luca reviews here is exactly what a student would see,
     then records a per-question verdict + corrected answer locally. */
  function initTool() {
    var pool = (window.QUESTION_BANK_MATH || []).slice();
    document.getElementById('rv-total-count').textContent = pool.length;

    var review = loadReview();
    var domains = [];
    pool.forEach(function (q) { if (domains.indexOf(q.domain) === -1) domains.push(q.domain); });
    var domainSel = document.getElementById('rv-filter-domain');
    domains.forEach(function (d) {
      var opt = document.createElement('option');
      opt.value = d; opt.textContent = d;
      domainSel.appendChild(opt);
    });

    var statusFilter = 'unreviewed';
    var domainFilter = '';
    var visible = [];
    var cursor = 0;

    function loadReview() {
      try {
        var raw = localStorage.getItem(REVIEW_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }
    function saveReview() {
      try { localStorage.setItem(REVIEW_KEY, JSON.stringify(review)); } catch (e) {}
    }

    function recomputeVisible() {
      visible = pool.filter(function (q) {
        if (domainFilter && q.domain !== domainFilter) return false;
        var r = review[q.qid];
        var status = r ? r.status : 'unreviewed';
        if (statusFilter === 'all') return true;
        return status === statusFilter;
      });
      if (cursor >= visible.length) cursor = Math.max(0, visible.length - 1);
    }

    function updateProgress() {
      var reviewed = 0, flagged = 0;
      pool.forEach(function (q) {
        var r = review[q.qid];
        if (r && r.status) reviewed++;
        if (r && r.status === 'issue') flagged++;
      });
      document.getElementById('rv-reviewed-count').textContent = reviewed;
      document.getElementById('rv-flagged-count').textContent = flagged;
      document.getElementById('rv-bar-fill').style.width = (pool.length ? Math.round((reviewed / pool.length) * 100) : 0) + '%';
    }

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function toast(msg) {
      var el = document.getElementById('rv-toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { el.classList.remove('show'); }, 1400);
    }

    function render() {
      var wrap = document.getElementById('rv-card-wrap');
      if (!visible.length) {
        wrap.innerHTML = '<div class="rv-empty">Nothing to show for this filter — everything in scope has already been reviewed.</div>';
        return;
      }
      var q = visible[cursor];
      var r = review[q.qid] || {};
      var poolIndex = pool.indexOf(q) + 1;

      var diffClass = 'diff-' + (q.difficulty || 'medium');
      var statusPillClass = r.status === 'ok' ? 'ok' : r.status === 'issue' ? 'issue' : 'unreviewed';
      var statusPillText = r.status === 'ok' ? 'Marked OK' : r.status === 'issue' ? 'Flagged' : 'Unreviewed';

      var html = '';
      html += '<div class="rv-card">';
      html += '<div class="rv-card-hed">';
      html += '<div class="rv-qnum-tile">' + poolIndex + '</div>';
      html += '<span class="rv-tag">' + escHtml(q.domain) + '</span>';
      html += '<span class="rv-tag">' + escHtml(q.skill) + '</span>';
      html += '<span class="rv-tag ' + diffClass + '">' + escHtml(q.difficulty) + '</span>';
      html += '<span class="rv-status-pill ' + statusPillClass + '">' + statusPillText + '</span>';
      html += '</div>';

      html += '<div class="dx-qtext">' + q.text + '</div>';

      var reviewerMcIndex = (typeof r.correctedIndex === 'number') ? r.correctedIndex : null;
      if (q.type === 'mc') {
        html += '<div class="dx-choices" id="rv-choices">';
        (q.choices || []).forEach(function (c, i) {
          var classes = 'dx-choice';
          if (i === q.correct) classes += ' rv-system-answer';
          if (reviewerMcIndex === i) classes += ' rv-your-pick';
          html += '<div class="' + classes + '" data-choice-index="' + i + '">';
          html += '<span class="dx-choice-letter">' + LETTERS[i] + '</span>';
          html += '<span class="dx-choice-text">' + c + '</span>';
          if (i === q.correct) html += '<span class="rv-choice-badge sys">System says correct</span>';
          else if (reviewerMcIndex === i) html += '<span class="rv-choice-badge pick">Your pick</span>';
          html += '</div>';
        });
        html += '</div>';
      } else {
        var frVal = (typeof r.correctedValue === 'string' && r.correctedValue !== '') ? r.correctedValue : q.answerValue;
        var changed = (typeof r.correctedValue === 'string' && r.correctedValue !== '' && r.correctedValue !== q.answerValue);
        html += '<div class="rv-fr-row"><label>Correct answer</label><input type="text" id="rv-fr-input" value="' + escHtml(frVal) + '" class="' + (changed ? 'rv-changed' : '') + '"><span class="rv-hint" style="margin:0;">system had: ' + escHtml(q.answerValue) + '</span></div>';
      }

      html += '<button type="button" class="rv-explain-toggle" id="rv-explain-toggle">Show explanation</button>';
      html += '<div class="rv-explain" id="rv-explain">' + (q.explanation || '(no explanation stored)') + '</div>';

      html += '<div class="rv-controls">';
      html += '<div class="rv-controls-row"><span class="rv-controls-label">Transferred correctly?</span>';
      html += '<button type="button" class="rv-btn rv-ok' + (r.status === 'ok' ? ' active' : '') + '" id="rv-mark-ok">&#10003; Yes, looks correct</button>';
      html += '<button type="button" class="rv-btn rv-issue' + (r.status === 'issue' ? ' active' : '') + '" id="rv-mark-issue">&#10007; No, needs a fix</button>';
      html += '</div>';
      html += '<textarea class="rv-note" id="rv-note" placeholder="What\'s wrong (if anything)? e.g. garbled text, broken figure, wrong choice marked correct, duplicate choices…">' + escHtml(r.note || '') + '</textarea>';
      html += '<div class="rv-hint">' + (q.type === 'mc' ? 'Click the actual correct choice above if the system\'s pick is wrong.' : 'Edit the correct answer above if the system\'s value is wrong.') + '</div>';
      html += '</div>';

      html += '<div class="rv-nav-row">';
      html += '<button type="button" class="rv-nav-btn secondary" id="rv-prev-btn"' + (cursor === 0 ? ' disabled' : '') + '>&larr; Prev</button>';
      html += '<span class="rv-hint">' + (cursor + 1) + ' of ' + visible.length + ' in this view</span>';
      html += '<button type="button" class="rv-nav-btn" id="rv-next-btn"' + (cursor === visible.length - 1 ? ' disabled' : '') + '>Next &rarr;</button>';
      html += '</div>';
      html += '</div>';

      wrap.innerHTML = html;
      wireCard(q);
    }

    function ensureReviewEntry(qid) {
      if (!review[qid]) review[qid] = { status: null, note: '', correctedIndex: null, correctedValue: null, reviewedAt: null };
      return review[qid];
    }

    function wireCard(q) {
      var explainBtn = document.getElementById('rv-explain-toggle');
      var explainEl = document.getElementById('rv-explain');
      explainBtn.addEventListener('click', function () {
        explainEl.classList.toggle('open');
        explainBtn.textContent = explainEl.classList.contains('open') ? 'Hide explanation' : 'Show explanation';
      });

      var noteEl = document.getElementById('rv-note');
      noteEl.addEventListener('input', function () {
        var r = ensureReviewEntry(q.qid);
        r.note = noteEl.value;
        saveReview();
      });

      if (q.type === 'mc') {
        document.querySelectorAll('#rv-choices .dx-choice').forEach(function (row) {
          row.addEventListener('click', function () {
            var idx = Number(row.getAttribute('data-choice-index'));
            var r = ensureReviewEntry(q.qid);
            r.correctedIndex = (r.correctedIndex === idx) ? null : idx; // click again to clear
            saveReview();
            render();
          });
        });
      } else {
        var frInput = document.getElementById('rv-fr-input');
        frInput.addEventListener('input', function () {
          var r = ensureReviewEntry(q.qid);
          r.correctedValue = frInput.value;
          saveReview();
        });
      }

      document.getElementById('rv-mark-ok').addEventListener('click', function () { markAndAdvance(q, 'ok'); });
      document.getElementById('rv-mark-issue').addEventListener('click', function () { markStatus(q, 'issue'); });
      document.getElementById('rv-prev-btn').addEventListener('click', function () { goPrev(); });
      document.getElementById('rv-next-btn').addEventListener('click', function () { goNext(); });
    }

    function markStatus(q, status) {
      var r = ensureReviewEntry(q.qid);
      r.status = status;
      r.reviewedAt = new Date().toISOString();
      saveReview();
      updateProgress();
      render();
    }

    function markAndAdvance(q, status) {
      markStatus(q, status);
      toast(status === 'ok' ? 'Marked correct' : 'Flagged');
      recomputeVisible();
      // If the current filter is "unreviewed", this question just fell out
      // of view — cursor naturally lands on the next one without moving.
      if (statusFilter !== 'unreviewed' && cursor < visible.length - 1) cursor++;
      render();
    }

    function goPrev() { if (cursor > 0) { cursor--; render(); } }
    function goNext() { if (cursor < visible.length - 1) { cursor++; render(); } }

    document.getElementById('rv-filter-status').addEventListener('change', function (e) {
      statusFilter = e.target.value;
      cursor = 0;
      recomputeVisible();
      render();
    });
    document.getElementById('rv-filter-domain').addEventListener('change', function (e) {
      domainFilter = e.target.value;
      cursor = 0;
      recomputeVisible();
      render();
    });

    document.addEventListener('keydown', function (e) {
      if (toolEl.style.display === 'none') return;
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'TEXTAREA' || tag === 'INPUT') return; // don't hijack typing in the note/answer fields
      if (!visible.length) return;
      var q = visible[cursor];
      if (e.key === 'y' || e.key === 'Y') { markAndAdvance(q, 'ok'); }
      else if (e.key === 'n' || e.key === 'N') { markStatus(q, 'issue'); document.getElementById('rv-note').focus(); }
      else if (e.key === 'ArrowLeft') goPrev();
      else if (e.key === 'ArrowRight') goNext();
    });

    function buildReport() {
      var rows = [];
      pool.forEach(function (q) {
        var r = review[q.qid];
        if (!r || !r.status) return;
        rows.push({
          qid: q.qid,
          domain: q.domain,
          skill: q.skill,
          difficulty: q.difficulty,
          type: q.type,
          transferredCorrectly: r.status === 'ok',
          systemAnswer: q.type === 'mc' ? LETTERS[q.correct] : q.answerValue,
          reviewerAnswer: q.type === 'mc'
            ? (typeof r.correctedIndex === 'number' ? LETTERS[r.correctedIndex] : null)
            : (r.correctedValue || null),
          note: r.note || '',
          reviewedAt: r.reviewedAt
        });
      });
      return { generatedAt: new Date().toISOString(), totalQuestions: pool.length, reviewed: rows.length, flagged: rows.filter(function (x) { return !x.transferredCorrectly; }).length, rows: rows };
    }

    document.getElementById('rv-export-btn').addEventListener('click', function () {
      var report = buildReport();
      var blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'math-bank-review-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('Exported ' + report.rows.length + ' reviewed questions');
    });

    recomputeVisible();
    updateProgress();
    render();
  }
})();
</script>
</body>
</html>
